[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-rads-nodule-agent"
version = "2.0.0"
description = "LungRADS Sentinel: Low-Dose CT Lung Cancer Screening Category & Action Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["agents", "lung_rads_nodule_agent"]
py-modules = ["cli", "enrichment", "lung_rads_sentinel", "simulator"]

[project.scripts]
lung-rads-nodule-engine = "lung_rads_nodule_agent.cli:main"
lung-rads-assess = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/lung-rads-nodule-agent"
Repository = "https://github.com/abusuraihsakhri/lung-rads-nodule-agent.git"
