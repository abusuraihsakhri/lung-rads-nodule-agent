[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-rads-nodule-engine"
version = "2.0.0"
description = "LungRADS Sentinel: Low-Dose CT Lung Cancer Screening Category & Action Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lung-rads-nodule-engine = "lung_rads_nodule_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/lung-rads-nodule-engine"
Repository = "https://github.com/abusuraihsakhri/lung-rads-nodule-engine.git"
