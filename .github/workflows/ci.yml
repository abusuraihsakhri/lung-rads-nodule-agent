name: Lung Rads Nodule Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[server,dev]'

    - name: Check dependency resolution and Python syntax
      run: |
        python -m pip check
        python -m compileall -q agents lung_rads_nodule_agent cli.py enrichment.py simulator.py lung_rads_sentinel.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Set up Node for browser rule tests
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Test browser assessment rules
      run: node --test tests/test_web.cjs

    - name: Security HMAC integrity smoke test
      run: |
        python -c "from agents.base import AuditTrail; t=AuditTrail('test-secret'); t.log('test','ci','check',{'pass':True}); assert t.verify_integrity(); t.logs[0]['actor']='tampered'; assert not t.verify_integrity()"

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
